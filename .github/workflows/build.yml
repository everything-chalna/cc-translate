name: Build

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  pull_request:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Package .app (smoke test)
        run: npm run dist
      - name: Verify bundle exists
        run: test -d "dist/mac-arm64/CC Translate.app" && echo "OK"
